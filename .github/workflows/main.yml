name: OpenVintage Build & Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Web preview — typecheck, tests, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenVintage
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build browser preview
        run: npm run build

  linux-core:
    name: Linux core / CLI — build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenVintage
        uses: actions/checkout@v6

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpci-dev

      - name: Build OpenVintage CLI
        run: make cli

      - name: Run OpenVintage test suite
        run: make test

  macos-intel:
    name: macOS Intel x86_64 — Catalina-compatible core
    runs-on: macos-15-intel

    steps:
      - name: Checkout OpenVintage
        uses: actions/checkout@v6

      - name: Show runner information
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Runner ==="
          uname -a
          sw_vers
          echo
          echo "=== Architecture ==="
          uname -m
          echo
          echo "=== Compiler ==="
          clang --version
          echo
          echo "=== SDK ==="
          xcrun --show-sdk-path
          xcrun --sdk macosx --show-sdk-version

      - name: Verify repository revision
        shell: bash
        run: |
          set -euo pipefail
          git log -1 --oneline
          git rev-parse HEAD
          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Clean previous simulator outputs
        shell: bash
        run: |
          set -euo pipefail
          cd OpenVintagePrebootSimulator
          make -C platform/macos -f Makefile.macos clean

      - name: Build macOS Intel simulator
        shell: bash
        run: |
          set -euo pipefail
          cd OpenVintagePrebootSimulator
          make macos-intel

      - name: Verify Intel binary
        shell: bash
        run: |
          set -euo pipefail
          BINARY="OpenVintagePrebootSimulator/bin/openvintage-simulator-macos-x86_64"
          test -f "$BINARY"
          test -x "$BINARY"
          file "$BINARY"
          lipo -info "$BINARY"
          otool -L "$BINARY"
          otool -l "$BINARY" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true
          ls -lh "$BINARY"

      - name: Build native macOS test runner
        shell: bash
        run: |
          set -euo pipefail
          cd OpenVintagePrebootSimulator
          mkdir -p build/macos-ci bin
          clang \
            -Wall -Wextra -O2 -g \
            -Iinclude -Iplatform/common -Iplatform/macos \
            tests/test_runner.c \
            src/ov_types.c src/ov_logger.c src/ov_memory.c src/ov_hardware.c \
            src/ov_macos_compat.c src/ov_resolver.c src/ov_cpu_engine.c src/ov_gpu_engine.c \
            src/ov_resource_manager.c src/ov_unified_cache.c src/ov_compatibility.c \
            src/ov_benchmark.c src/ov_diagnostics.c src/ov_core.c src/ov_ui.c \
            src/ov_perf_profile.c src/ov_boot_picker.c src/ov_deployment.c \
            src/ov_oclp_adapter.c src/ov_refind_adapter.c src/ov_security.c \
            platform/common/ov_platform.c platform/macos/ov_hardware_macos.c \
            -target x86_64-apple-macos10.15 \
            -o bin/test_runner_macos-x86_64 \
            -lpthread -lm \
            -framework CoreFoundation -framework IOKit -framework Metal -framework OpenGL

      - name: Run native macOS API test runner
        shell: bash
        run: |
          set -euo pipefail
          cd OpenVintagePrebootSimulator
          ./bin/test_runner_macos-x86_64

      - name: Run simulator help / CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd OpenVintagePrebootSimulator
          ./bin/openvintage-simulator-macos-x86_64 --help

      - name: Run MBP9,1 compatibility simulation
        shell: bash
        run: |
          set -euo pipefail
          cd OpenVintagePrebootSimulator
          ./bin/openvintage-simulator-macos-x86_64 \
            --cli --mac MBP9,1 --compat-matrix --target-os monterey --bench \
            --report ci_mbp91_report.txt --html ci_mbp91_report.html --json ci_mbp91_report.json

      - name: Collect core CI reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          for FILE in \
            OpenVintagePrebootSimulator/bin/openvintage-simulator-macos-x86_64 \
            OpenVintagePrebootSimulator/bin/test_runner_macos-x86_64 \
            OpenVintagePrebootSimulator/ci_mbp91_report.txt \
            OpenVintagePrebootSimulator/ci_mbp91_report.html \
            OpenVintagePrebootSimulator/ci_mbp91_report.json; do
            if [ -f "$FILE" ]; then cp "$FILE" ci-artifacts/; fi
          done
          if find ci-artifacts -type f -print -quit | grep -q .; then
            shasum -a 256 ci-artifacts/* > ci-artifacts/SHA256SUMS.txt
          fi

      - name: Upload macOS Intel core artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openvintage-macos-intel-x86_64
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

  macos-app:
    name: Native macOS application — Catalina x86_64 + modern arm64
    runs-on: macos-15-intel
    needs: [frontend, macos-intel]

    steps:
      - name: Checkout OpenVintage
        uses: actions/checkout@v6

      - name: Show app build environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun swiftc --version

      - name: Build native OpenVintage.app
        shell: bash
        run: |
          set -euo pipefail
          bash macOS/OpenVintageApp/build.sh

      - name: Verify native app bundle and Catalina target
        shell: bash
        run: |
          set -euo pipefail
          APP="build/OpenVintageApp/OpenVintage.app"
          BIN="$APP/Contents/MacOS/OpenVintage"
          test -d "$APP"
          test -x "$BIN"
          file "$BIN"
          lipo -info "$BIN"
          codesign --verify --deep --strict "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist" | grep -Fx '10.15'
          echo "=== Mach-O deployment commands ==="
          otool -l "$BIN" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX'
          echo "=== Linked frameworks ==="
          otool -L "$BIN"

      - name: Launch native app smoke test
        shell: bash
        run: |
          set -euo pipefail
          APP="build/OpenVintageApp/OpenVintage.app"
          BIN="$APP/Contents/MacOS/OpenVintage"
          LOG="$RUNNER_TEMP/openvintage-app.log"
          set +e
          "$BIN" >"$LOG" 2>&1 &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            STATUS=1
          else
            STATUS=0
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          fi
          set -e
          cat "$LOG" || true
          if [ "$STATUS" -ne 0 ]; then
            echo "OpenVintage.app executable exited before the smoke-test window could initialize."
            exit 1
          fi
          echo "Native OpenVintage.app launch smoke test passed."

      - name: Package native macOS application
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            build/OpenVintageApp/OpenVintage.app \
            build/OpenVintageApp/OpenVintage-macOS-universal.zip

      - name: Upload native macOS application
        uses: actions/upload-artifact@v4
        with:
          name: openvintage-macos-universal-app
          path: build/OpenVintageApp/OpenVintage-macOS-universal.zip
          if-no-files-found: error
          retention-days: 14
